<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="100%">
    <!-- Escudo / Icono -->
    <g transform="translate(10, 10)">
        <!-- Escudo Azul (Izquierda) -->
        <path d="M 10 30 C 10 80 30 110 65 130 L 65 35 Z" fill="#003366" />
        
        <!-- Escudo Verde (Derecha) -->
        <path d="M 120 30 C 120 80 100 110 65 130 L 65 35 Z" fill="#619b41" />
        
        <!-- Persona Central (Azul) -->
        <circle cx="65" cy="20" r="14" fill="#003366"/>
        <path d="M 45 70 C 45 45 85 45 85 70 L 85 105 L 45 105 Z" fill="#003366"/>
        
        <!-- Persona Izquierda (Verde) -->
        <circle cx="32" cy="40" r="10" fill="#619b41"/>
        <path d="M 18 80 C 18 55 46 55 46 80 L 46 100 L 18 100 Z" fill="#619b41"/>
        
        <!-- Persona Derecha (Verde) -->
        <circle cx="98" cy="40" r="10" fill="#619b41"/>
        <path d="M 84 80 C 84 55 112 55 112 80 L 112 100 L 84 100 Z" fill="#619b41"/>
        
        <!-- Checkmark Blanco -->
        <path d="M 25 85 L 55 110 L 115 55 L 100 45 L 55 85 L 35 70 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    </g>
    
    <!-- Texto Principal -->
    <text x="150" y="65" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="52" fill="#003366" letter-spacing="-1">Soluciones</text>
    <text x="150" y="112" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="46" fill="#619b41" letter-spacing="-1">Administrativas</text>
    
    <!-- Línea inferior y subtítulo -->
    <path d="M 150 135 L 240 135" stroke="#777" stroke-width="1.5" />
    <text x="255" y="140" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="15" fill="#555" letter-spacing="2">EN SALUD LABORAL</text>
    <path d="M 435 135 L 525 135" stroke="#777" stroke-width="1.5" />
</svg>
